[package]
name = "basalt-plugin-opencode"
version = "0.1.0"
edition = "2021"
description = "OpenCode AI Agent launcher plugin for Basalt with model and variant support"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
basalt-plugin-sdk = { git = "https://github.com/adevcorn/basalt-plugin-sdk", tag = "v0.1.1", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"


